# ════════════════════════════════════════════════════════════════════════
# Netlify — relais HLS uniquement
# ════════════════════════════════════════════════════════════════════════
#
# L'application est hébergée sur Vercel. Ce site Netlify ne sert qu'une seule
# chose : la fonction Edge qui relaie la liste de lecture HLS d'un direct
# Facebook, parce que la même route déployée sur Vercel reçoit une réponse
# inutilisable alors qu'une machine de développement obtient la liste.
#
# Rien à construire ici : aucune page n'est publiée, seule la fonction Edge est
# déployée. D'où un dossier de publication vide et une commande de construction
# absente — inutile de reconstruire toute l'application Next pour un fichier.
#
# Déploiement :
#   npx netlify login
#   npx netlify sites:create --name <nom-du-site>
#   npx netlify deploy --prod
#
# Puis, dans les variables d'environnement Vercel de l'application :
#   NEXT_PUBLIC_HLS_RELAY = https://<nom-du-site>.netlify.app/hls/facebook
#
# Sans cette variable, l'application vise Facebook directement — ce qui
# fonctionne sur iPhone et nulle part ailleurs. Le relais est donc un ajout,
# jamais un prérequis.

[build]
  publish = "netlify/public"

[functions]
  directory = "netlify/functions"
