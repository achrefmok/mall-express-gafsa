<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <!-- fond dégradé chaud (hue taxi ≈ 75) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="0.55" stop-color="#FFE9B8"/>
      <stop offset="1" stop-color="#FFD88B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDE59"/>
      <stop offset="0.5" stop-color="#F5B800"/>
      <stop offset="1" stop-color="#D99A00"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="1" stop-color="#FFDC5C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF3FF"/>
      <stop offset="1" stop-color="#9CCBEE"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A44"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- carte arrondie -->
  <rect x="0" y="0" width="480" height="480" rx="140" fill="url(#bg)"/>
  <rect x="0" y="0" width="480" height="480" rx="140" fill="url(#glow)"/>

  <!-- ombre portée au sol -->
  <ellipse cx="240" cy="338" rx="150" ry="26" fill="#C78A12" opacity="0.35"/>
  <ellipse cx="240" cy="336" rx="138" ry="20" fill="#B87A0C" opacity="0.25"/>

  <!-- TAXI vue 3/4 -->
  <g transform="translate(240 236)">
    <!-- roues -->
    <g>
      <circle cx="-78" cy="34" r="24" fill="#1B1B22"/>
      <circle cx="-78" cy="34" r="13" fill="url(#wheel)"/>
      <circle cx="-78" cy="34" r="5" fill="#8C8C96"/>
      <circle cx="78" cy="34" r="24" fill="#1B1B22"/>
      <circle cx="78" cy="34" r="13" fill="url(#wheel)"/>
      <circle cx="78" cy="34" r="5" fill="#8C8C96"/>
    </g>
    <!-- carrosserie -->
    <path d="M-128 28 L-132 -6 Q-133 -16 -122 -18 L-34 -22 Q-20 -23 -16 -30 L10 -52 Q14 -56 20 -56 L74 -52 Q86 -51 88 -40 L98 8 L128 22 L126 30 L-120 34 Q-130 34 -128 28 Z"
          fill="url(#body)" stroke="#D08F00" stroke-width="2"/>
    <!-- toit / pavillon -->
    <path d="M-34 -20 L-22 -34 Q-16 -42 -2 -44 L38 -44 Q50 -43 56 -36 L70 -24 L-34 -20 Z"
          fill="url(#roof)"/>
    <!-- vitres -->
    <path d="M-20 -34 L8 -40 L28 -40 L40 -30 L-8 -26 L-22 -30 Z" fill="url(#glass)" stroke="#7FA9C6" stroke-width="1.5"/>
    <path d="M34 -39 L48 -38 Q54 -36 56 -32 L58 -24 L38 -24 L34 -39 Z" fill="url(#glass)" stroke="#7FA9C6" stroke-width="1.5"/>
    <!-- porte arrière -->
    <line x1="78" y1="-4" x2="74" y2="26" stroke="#D08F00" stroke-width="2"/>
    <!-- bande damier sur la portière -->
    <g>
      <rect x="-18" y="-4" width="8" height="8" fill="#1B1B22"/>
      <rect x="-2" y="-4" width="8" height="8" fill="#F7F7FB"/>
      <rect x="14" y="-4" width="8" height="8" fill="#1B1B22"/>
      <rect x="30" y="-4" width="8" height="8" fill="#F7F7FB"/>
      <rect x="46" y="-4" width="8" height="8" fill="#1B1B22"/>
      <rect x="-10" y="4" width="8" height="8" fill="#F7F7FB"/>
      <rect x="6" y="4" width="8" height="8" fill="#1B1B22"/>
      <rect x="22" y="4" width="8" height="8" fill="#F7F7FB"/>
      <rect x="38" y="4" width="8" height="8" fill="#1B1B22"/>
      <rect x="54" y="4" width="8" height="8" fill="#F7F7FB"/>
    </g>
    <!-- feux avant -->
    <path d="M96 6 Q104 4 104 10 L102 22 L94 18 Z" fill="#FFE37A" stroke="#E8B000" stroke-width="1.5"/>
    <path d="M91 12 L99 14 L97 20 L91 18 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- feux arrière -->
    <path d="M-132 2 L-118 0 L-120 20 L-130 22 Z" fill="#FF6B4A" stroke="#D84A2C" stroke-width="1.5"/>
    <!-- enseignes de porte -->
    <circle cx="-74" cy="10" r="11" fill="#FFFFFF" opacity="0.92"/>
    <text x="-74" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">TX</text>
    <!-- barre toit "TAXI" -->
    <rect x="-14" y="-58" width="44" height="13" rx="4" fill="#FFF" stroke="#CCC" stroke-width="1.5"/>
    <text x="8" y="-48.5" font-family="Arial, sans-serif" font-size="9.5" font-weight="900" fill="#16161c" text-anchor="middle" letter-spacing="1">TAXI</text>
  </g>
</svg>
