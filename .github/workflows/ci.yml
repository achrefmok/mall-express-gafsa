# Contrôles à chaque poussée.
#
# Ce que la machine vérifie ici, personne n'a à y penser : la suite complète
# tourne avant que le code n'arrive en production. Un « check:links » rouge est
# déjà passé inaperçu une fois — plus maintenant.
#
# Aucun secret n'est requis. Les variables Supabase sont des valeurs factices :
# le build n'appelle la base que pour pré-rendre les fiches boutique, et le code
# retombe proprement sur une liste vide quand elle est injoignable. Les
# vérifications qui ont besoin de la vraie base — db:check, db:smoke — restent
# manuelles, elles écrivent dans un projet réel.

name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une poussée qui en suit une autre annule la précédente : inutile de vérifier
# un état déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build
      NEXT_PUBLIC_SITE_URL: https://exemple.test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Style
        run: npx next lint

      - name: Liens internes
        run: npm run check:links

      # ── Les contrôles métier ────────────────────────────────────────────
      #
      # Ils étaient écrits et ne tournaient pas. L'audit du 26 août 2026 a
      # compté 126 assertions vérifiées à la main une seule fois, puis jamais
      # rejouées — exactement la situation que le commentaire en tête de ce
      # fichier prétendait avoir corrigée, pour un script sur six.
      #
      # Chacun est une étape distincte : un échec doit nommer ce qui a cassé
      # sans obliger à ouvrir le journal.

      - name: Sécurité — évasion de balise
        run: npm run check:securite

      - name: Variantes de couleur
        run: npm run check:variants

      - name: Recoloration du tissu
        run: npm run check:recolor

      # `check:taxi` interroge le service de routage public. Il se met de
      # lui-même en attente quand celui-ci est injoignable, et ne rendra donc
      # pas la CI instable un jour de panne d'OSRM.
      - name: Taxi — géographie et routage
        run: npm run check:taxi

      - name: Taxi — présence des chauffeurs
        run: npm run check:presence

      - name: Affiche marketing
        run: npm run check:poster

      - name: Préparation des photos
        run: npm run check:upload

      # Un lien partagé hier doit fonctionner demain : les fiches produit ont
      # deux formes d'adresse, et l'ancienne circule depuis des mois.
      - name: Stabilité des adresses
        run: npm run check:url

      - name: Build de production
        run: npx next build

      # Après la construction, parce que le budget se mesure sur ce qui sera
      # réellement envoyé — pas sur une estimation.
      - name: Budget de performance
        run: npm run check:budget
