# Déploiement automatique en production, à chaque poussée sur `main`.
#
# ┌───────────────────────────────────────────────────────────────────────┐
# │  N'UTILISEZ CECI QUE SI L'INTÉGRATION GIT DE VERCEL EST ABSENTE.      │
# │                                                                       │
# │  Le plus simple reste Vercel → Settings → Git → « Connect Git         │
# │  Repository » : les poussées déploient alors toutes seules, sans      │
# │  aucun secret à gérer ici.                                            │
# │                                                                       │
# │  Si les deux sont actifs, chaque poussée déploie deux fois — inutile, │
# │  et cela consomme votre quota de build.                               │
# └───────────────────────────────────────────────────────────────────────┘
#
# Trois secrets à créer dans GitHub → Settings → Secrets and variables →
# Actions :
#
#   VERCEL_TOKEN       vercel.com/account/tokens
#   VERCEL_ORG_ID      dans .vercel/project.json après un `vercel link`
#   VERCEL_PROJECT_ID  idem
#
# Tant qu'ils manquent, le travail s'arrête proprement au lieu d'échouer :
# un dépôt fraîchement cloné ne doit pas afficher une croix rouge.

name: Déploiement

# ── Le déploiement attend que les contrôles soient verts ────────────────
#
# Il partait auparavant sur `push`, en parallèle de la CI : une poussée qui
# cassait les types, le style ou l'un des sept contrôles métier partait quand
# même en production, et l'échec s'affichait à côté du déploiement réussi.
#
# `workflow_run` inverse l'ordre : ce travail ne démarre qu'une fois « Contrôles »
# terminé, et la condition `conclusion == 'success'` ci-dessous refuse tout ce
# qui n'est pas vert.
#
# ATTENTION — si vous utilisez l'intégration Git de Vercel plutôt que ce
# fichier, ce garde-fou ne s'applique pas : Vercel déploie de son côté, sans
# rien savoir de GitHub Actions. L'équivalent s'y règle dans
# Settings → Git → Ignored Build Step, avec la commande :
#
#   npx tsc --noEmit && npm run check
#
# Une commande qui échoue y annule la construction.
on:
  workflow_run:
    workflows: ["Contrôles"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # ne jamais interrompre un déploiement en cours

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Un déclenchement manuel reste possible — c'est la porte de sortie quand il
    # faut publier un correctif urgent en connaissance de cause.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Les secrets sont-ils configurés ?
        id: secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] \
          && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] \
          && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Vercel absents — déploiement ignoré. Utilisez l'intégration Git de Vercel, ou renseignez VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.pret == 'oui'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.pret == 'oui'
        with:
          node-version: 22
          cache: npm

      - name: Déployer en production
        if: steps.secrets.outputs.pret == 'oui'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
